name: Automation
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: automation-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install; fi
          python -m pip install -r requirements-service.txt
      - name: Prepare browser
        run: |
          npx playwright install --with-deps chromium
      - name: Typecheck when configured
        run: npm run --if-present check
      - name: Start isolated official ParaBank
        run: python scripts/start_parabank.py
      - name: Execute real application scenarios
        run: python scripts/run.py --local-api -- npm test
      - name: Stop isolated ParaBank
        if: always()
        run: docker rm --force parabank-under-test || true
      - name: Preserve native reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: automation-evidence
          path: |
            reports/
            package-lock.json
            results/
            test-results/
            playwright-report/
            testscript-results/
            target/surefire-reports/
            target/site/
            target/karate-reports/
          if-no-files-found: warn
          retention-days: 7
